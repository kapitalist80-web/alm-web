# Initial HTTP-only config used before the first certificate is obtained.
# After certbot issues the certificate, docker-compose restarts nginx
# with the full HTTPS template (default.conf.template).

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'HTTPS not yet configured. Run init-letsencrypt.sh first.';
        add_header Content-Type text/plain;
    }
}
